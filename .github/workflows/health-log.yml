name: Health log regression tests
on:
  pull_request:
    paths:
      - 'frontend/components/plant/HealthLogModal.jsx'
      - 'tests/health-log/**'
      - '.github/workflows/health-log.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/components/plant/HealthLogModal.jsx'
      - 'tests/health-log/**'
      - '.github/workflows/health-log.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/health-log/package-lock.json
      - run: npm ci
        working-directory: tests/health-log
      - run: npm test
        working-directory: tests/health-log
