name: BosWash stat display
on:
  pull_request:
    paths:
      - 'src/BosWashMap.jsx'
      - 'tests/map-stats/**'
      - '.github/workflows/map-stats.yml'
  push:
    branches: [main]
    paths:
      - 'src/BosWashMap.jsx'
      - 'tests/map-stats/**'
      - '.github/workflows/map-stats.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stat-display:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/map-stats/package-lock.json
      - run: npm ci
        working-directory: tests/map-stats
      - run: npm test
        working-directory: tests/map-stats
